# ==============================================================================
#  SYSWARDEN — Configuration de déploiement homelab
# ------------------------------------------------------------------------------
#  Hôte    : Freebox Ultra · Debian 12 Bookworm · ARM64
#  Profil  : hôte Docker avec CrowdSec en place
#  Usage   : syswarden /opt/syswarden/syswarden-auto.conf
#
#  !! Avant de déployer : renseigner les variables marquées [A REMPLIR] !!
#  !! Garder ce fichier en chmod 600 — il peut contenir des clés API    !!
# ==============================================================================


# ------------------------------------------------------------------------------
#  CONFORMITÉ ENTREPRISE
# ------------------------------------------------------------------------------

# Mode entreprise : désactive la télémétrie tierce (AbuseIPDB, etc.)
# "n" = on utilise AbuseIPDB ci-dessous, donc on le laisse actif
SYSWARDEN_ENTERPRISE_MODE="n"


# ------------------------------------------------------------------------------
#  ACCÈS SSH
# ------------------------------------------------------------------------------

# Port SSH actuel sur l'hôte.
# Si WireGuard est activé ci-dessous, SSH n'écoutera plus que sur wg0 après
# l'installation — garder un accès console (Freebox) disponible en parallèle.
SYSWARDEN_SSH_PORT="22"   # [A REMPLIR] remplacer par ton port SSH réel


# ------------------------------------------------------------------------------
#  BACKEND PARE-FEU
# ------------------------------------------------------------------------------

# nftables est le backend natif de Debian 12.
# CrowdSec utilise aussi nftables — les deux opèrent sur des tables distinctes :
#   - SysWarden : syswarden_table (hook netdev, ingress NIC — L2/L3)
#   - CrowdSec  : ses propres chaînes (hook input — L4/L7 comportemental)
# Aucun conflit d'écriture possible entre les deux.
SYSWARDEN_FIREWALL_BACKEND="nftables"


# ------------------------------------------------------------------------------
#  WHITELISTING
# ------------------------------------------------------------------------------

# Activer le whitelisting automatique des plages d'infrastructure.
# Critique pour ne pas se bloquer hors de la Freebox.
SYSWARDEN_WHITELIST_INFRA="y"

# IP(s) d'administration à ne jamais bannir, séparées par des espaces.
# Inclure : IP LAN de ta machine admin, IP du tunnel WireGuard le cas échéant.
# Exemple : "192.168.1.10 10.66.66.2"
SYSWARDEN_WHITELIST_IPS=""   # [A REMPLIR]


# ------------------------------------------------------------------------------
#  DOCKER
# ------------------------------------------------------------------------------

# Indispensable. Sans ça, les règles Default-Deny de SysWarden bloquent
# le trafic inter-conteneurs sur les bridges Docker (172.16.0.0/12).
# SysWarden détecte automatiquement docker0 et les réseaux actifs
# (frontend_net, backend_net, monitoring_net) et les exclut du filtrage.
SYSWARDEN_USE_DOCKER="y"


# ------------------------------------------------------------------------------
#  DURCISSEMENT CIS
# ------------------------------------------------------------------------------

# Durcissement noyau/SSH/filesystem (ASLR, eBPF, source routing, core dumps…)
# "y" uniquement sur installation fraîche — peut casser des configs existantes
# si la stack Docker est déjà en production. À évaluer par section.
SYSWARDEN_HARDENING="n"
APPLY_CIS_L2_HARDENING="n"


# ------------------------------------------------------------------------------
#  BLOCKLISTS RÉSEAU
# ------------------------------------------------------------------------------

# Choix de la blocklist Data-Shield :
#   1 = Standard    (équilibre couverture / faux positifs) — recommandé pour démarrer
#   2 = Extended    (couverture plus large, quelques faux positifs possibles)
#   3 = Aggressive  (couverture maximale, déconseillé sans supervision active)
#
# En complément de CrowdSec, le niveau 1 est suffisant — CrowdSec couvre déjà
# les comportements L7 que les niveaux 2/3 tentent d'anticiper côté réseau.
SYSWARDEN_LIST_CHOICE="1"

# URL d'une blocklist personnalisée (optionnel).
SYSWARDEN_CUSTOM_URL=""

# Hash SHA256 de la liste custom pour vérification d'intégrité (optionnel, recommandé NIS2).
SYSWARDEN_CUSTOM_HASH=""


# ------------------------------------------------------------------------------
#  GÉOBLOCAGE
# ------------------------------------------------------------------------------

# Activer le filtrage GeoIP.
# La liste ci-dessous est calibrée sur les stats du honeypot Cowrie et des
# décisions CrowdSec visibles dans Metabase — pays à fort volume d'attaques
# détectés sur l'infra, sans pays légitimes pour l'usage personnel.
# À revoir régulièrement en consultant le dashboard Metabase.
SYSWARDEN_ENABLE_GEO="y"

# Codes ISO 3166-1 alpha-2, séparés par des espaces.
SYSWARDEN_GEO_CODES="ru cn kp ir vn in by ng bd af al by bo bg bi cm cg dj eg ge gh hn iq ke kz lb ly me pk pa sd tm uz zm zw ye"


# ------------------------------------------------------------------------------
#  BLOCAGE ASN
# ------------------------------------------------------------------------------

# Bloquer les Autonomous System Numbers connus pour héberger de l'infrastructure
# malveillante (bulletproof hosters, cybercrime, botnets).
SYSWARDEN_ENABLE_ASN="y"

# Liste d'ASN à bloquer, format "AS<number>", séparés par des espaces.
# Exemples : AS30823 (Combahton / bulletproof), AS210644 (AEZA GROUP),
# AS209588 (Flyservers), AS44477 (Stark Industries).
# Ajuster selon les ASN remontés par Metabase / CrowdSec.
SYSWARDEN_ASN_LIST="AS30823 AS210644 AS209588 AS44477"


# ------------------------------------------------------------------------------
#  SPAMHAUS
# ------------------------------------------------------------------------------

# Intégrer les listes DROP/EDROP de Spamhaus (réseaux alloués à des spammeurs
# et cybercriminels connus). Complément efficace aux blocklists Data-Shield.
SYSWARDEN_USE_SPAMHAUS="y"


# ------------------------------------------------------------------------------
#  WIREGUARD (accès admin cloisonné)
# ------------------------------------------------------------------------------

# Activer WireGuard.
# Après installation, SSH n'écoute plus que sur wg0 — l'administration de l'hôte
# passe uniquement par le tunnel VPN. Vérifier l'accès WireGuard avant de
# fermer la session SSH courante.
SYSWARDEN_ENABLE_WG="y"

# Port UDP exposé pour WireGuard.
SYSWARDEN_WG_PORT="51820"

# Sous-réseau VPN WireGuard (doit être différent des réseaux Docker et LAN).
SYSWARDEN_WG_SUBNET="10.66.66.0/24"


# ------------------------------------------------------------------------------
#  ABUSEIPDB (threat intelligence partagée)
# ------------------------------------------------------------------------------

# Signaler automatiquement les IPs bannies à AbuseIPDB.
# Permet de contribuer à la communauté de threat intelligence.
SYSWARDEN_ENABLE_ABUSE="y"

# Clé API AbuseIPDB (80 caractères). Créer un compte sur abuseipdb.com.
SYSWARDEN_ABUSE_API_KEY=""   # [A REMPLIR]

# Rapporter les bans Fail2ban (L7) à AbuseIPDB.
SYSWARDEN_REPORT_F2B="y"

# Rapporter les bans pare-feu (L3/L4) à AbuseIPDB.
SYSWARDEN_REPORT_FW="y"


# ------------------------------------------------------------------------------
#  WAZUH / SIEM (non utilisé dans cette infra)
# ------------------------------------------------------------------------------

# Cette infra n'intègre pas de SIEM Wazuh — le monitoring passe par
# Prometheus + Grafana et la threat intel via Metabase (connecté à CrowdSec).
SYSWARDEN_ENABLE_WAZUH="n"
SYSWARDEN_WAZUH_IP=""
SYSWARDEN_WAZUH_NAME=""
SYSWARDEN_WAZUH_GROUP=""
SYSWARDEN_WAZUH_COMM_PORT=""
SYSWARDEN_WAZUH_ENROLL_PORT=""


# ------------------------------------------------------------------------------
#  DÉSINSTALLATION
# ------------------------------------------------------------------------------

# Effacement sécurisé de la configuration lors de la désinstallation.
# "y" = SysWarden efface ses traces (journald flush, nettoyage des tables
# nftables custom) — recommandé pour éviter les résidus en cas de rollback.
SYSWARDEN_SECURE_WIPE_CONF="y"
